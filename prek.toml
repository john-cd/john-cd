# Portable repository checks for this documentation-only profile repository.
minimum_prek_version = "0.5.6"

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "destroyed-symlinks" },
  { id = "end-of-file-fixer" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "repository-format", name = "Repository formatting", entry = "dprint check --log-level=error", language = "system", files = '\.(md|json|jsonc|yaml|yml)$', pass_filenames = false },
]
