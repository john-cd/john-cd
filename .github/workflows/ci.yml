# Workflow contract documentation (maintained with the implementation).
# Workflow contract: john-cd / CI.
# Purpose: Validate the maintained source with the tools and commands listed in this job.
# Execution: push, pull_request, workflow_dispatch. Trigger branches/paths below are the
# authoritative input boundary.
# Manual operation: use the Actions tab or gh workflow run; input defaults below apply unless
# explicitly overridden.
# Run policy: newer runs replace obsolete validation in the same group.
# Access: workflow token permissions are {"contents": "read"}; job-level overrides below own any
# elevated access.
# Maintenance: keep full-SHA action references/tool pins coordinated with Dependabot and the
# repository configuration. See README.md in this directory for the job map and local validation.
# End workflow contract documentation.

name: CI
on:
  push:
    branches: [main, develop]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Job check: Validate the maintained source with the tools and commands listed in this job.
  # Keep compatible checks in the same job to reuse installed dependencies and build outputs;
  # distinct OS/feature entries retain their behavior coverage.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2
